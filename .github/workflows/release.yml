name: Release
on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel previous runs and purge history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "开始清理历史运行记录..."
          # 列出该工作流的所有运行记录，提取 ID 和状态
          gh run list --workflow "${{ github.workflow }}" --limit 100 --json databaseId,status --jq '.[] | "\(.databaseId) \(.status)"' | while read -r id status; do
            # 跳过当前正在执行的这个 run
            if [ "$id" == "${{ github.run_id }}" ]; then
              continue
            fi
            
            # 如果还在运行或排队，先取消
            if [[ "$status" == "in_progress" || "$status" == "queued" || "$status" == "waiting" ]]; then
              echo "🛑 终止旧的运行任务: $id (状态: $status)"
              gh run cancel "$id" || true
            fi
            
            # 强制删除该记录
            echo "🗑️ 删除旧的运行记录: $id"
            gh run delete "$id" || true
          done
          echo "✅ 历史记录清理完成。"

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Decode keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/release.keystore
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
      - name: Build APK
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/deepseek-app-replica.apk
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-app-replica
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 1
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.1
          name: Release v0.9.1
          files: android/app/build/outputs/apk/release/*.apk
          overwrite: true

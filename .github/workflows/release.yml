name: Release
on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Purge all old runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "⏳ 正在清理之前的所有工作流记录..."
          # 获取所有历史运行记录的 ID
          RUNS=$(gh run list --limit 100 --json databaseId --jq '.[].databaseId')
          for id in $RUNS; do
            # 跳过当前正在运行的这一条
            if [ "$id" == "${{ github.run_id }}" ]; then
              continue
            fi
            echo "🗑️ 正在删除记录: $id"
            # 使用 api 接口强制取消并删除，忽略可能产生的 API 报错
            gh api -X POST /repos/${{ github.repository }}/actions/runs/$id/cancel || true
            gh api -X DELETE /repos/${{ github.repository }}/actions/runs/$id || true
          done
          echo "✅ 历史记录清理完毕。"

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Decode keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/release.keystore
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
      - name: Build APK
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/deepseek-app-replica.apk
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-app-replica
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 1
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.1
          name: Release v0.9.1
          files: android/app/build/outputs/apk/release/*.apk
          overwrite: true
